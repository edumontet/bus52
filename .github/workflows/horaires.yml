name: Horaires théoriques
on:
  schedule:
    - cron: "15 2 * * *"   # chaque nuit vers 3h15 (heure de Paris)
  workflow_dispatch:
  push:
    paths: ["scripts/build_timetable.py", ".github/workflows/horaires.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_timetable.py
      - name: Publier
        run: |
          git config user.name "horaires-bot"
          git config user.email "horaires-bot@users.noreply.github.com"
          git add data/horaires.json
          git diff --cached --quiet || (git commit -m "Horaires théoriques du $(date +%F)" && git push)
